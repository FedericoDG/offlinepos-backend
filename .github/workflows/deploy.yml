name: deploy-pos-to-vps

on:
  push:
    branches: [main]

concurrency:
  group: deploy-pos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Puerta: si algo de esto falla, no se despliega. Son las mismas
      # comprobaciones que corre build.yml en cada rama; aca son lo ultimo que
      # se mira antes de publicar, porque un push directo a main nunca pasa por
      # una rama.
      - name: Puerta de comprobaciones
        run: sh scripts/verificar.sh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy and verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes -i ~/.ssh/deploy_key "root@$SSH_HOST" '
            set -e
            cd /root/apps/offlinepos
            git fetch origin
            git reset --hard origin/main
            bash scripts/deploy.sh
          '

      - name: Report failure
        if: failure()
        run: |
          echo "El deploy no se completo: mirar los pasos de arriba."
          echo "Si el que fallo es el paso de deploy, el pre-flight de scripts/deploy.sh corta antes del swap: el stack en pie deberia seguir igual. Confirmar con: docker compose -f compose.prod.yml ps"
          echo "Para volver atras la base: ver /root/respaldos-offlinepos/LEEME.txt"
