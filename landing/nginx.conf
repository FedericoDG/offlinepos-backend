# nginx interno del contenedor de la landing. No expone puertos: el borde
# (repo vps-nginx) lo alcanza por la red vps-net, igual que al panel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre: se pueden cachear para siempre.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes y logos.
    location ~* \.(png|jpe?g|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # El sitio es una sola página: cualquier ruta cae en el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
