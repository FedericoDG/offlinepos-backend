# Stack de produccion POS offline en el VPS.
#
# - Sin Postgres local: DATABASE_URL apunta a Neon (Postgres gestionado).
# - Sin `ports:` publicados: solo nginx (repo vps-nginx, red vps-net) expone
#   80/443 y proxea a estos contenedores por nombre de servicio.
# - Variables: cada servicio lee su archivo en el VPS
#   (/root/apps/offlinepos/deploy/env/*.env, NO versionados; ver
#   deploy/.env.production.example). BACKEND_URL no es confidencial y va
#   fijo abajo (nombre de servicio interno).

services:
  panel-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: offlinepos-backend
    restart: unless-stopped
    env_file:
      - ./deploy/env/backend.env
    environment:
      PORT: "4000"
      NODE_ENV: production
      # Origen público del backend para las URLs absolutas que consumen
      # clientes externos (descargas del updater y link móvil del chat).
      # No es confidencial y va fijo acá: así el contenedor no depende de los
      # headers del request (el panel interno le pega como panel-backend:4000,
      # que NO sirve como URL pública). Debe ser SOLO el origen, sin path.
      PUBLIC_BASE_URL: https://aipos.com.ar
    volumes:
      - pos-updates:/app/updates
    networks:
      - vps-net

  panel-web:
    build:
      context: .
      dockerfile: ./panel/Dockerfile
    container_name: offlinepos-panel
    restart: unless-stopped
    env_file:
      - ./deploy/env/panel.env
    environment:
      BACKEND_URL: http://panel-backend:4000
    depends_on:
      panel-backend:
        condition: service_started
    networks:
      - vps-net

  # Landing pública (estático). Sin puertos publicados, igual que el resto:
  # el borde la alcanza por nombre de servicio dentro de vps-net.
  landing:
    build:
      context: .
      dockerfile: ./landing/Dockerfile
    container_name: offlinepos-landing
    restart: unless-stopped
    networks:
      - vps-net

  # Herramientas que NO son parte del stack: se invocan a mano o desde
  # scripts/deploy.sh con `compose run`. El perfil las deja fuera de `up -d`,
  # asi que no levantan nada por si solas.
  #
  # El cliente de Postgres tiene que ser igual o mas nuevo que el servidor
  # (Neon corre 18.x): un pg_dump mas viejo que el servidor no dumpea.
  respaldos:
    image: postgres:18-alpine
    profiles: ["herramientas"]
    env_file:
      - ./deploy/env/backend.env
    volumes:
      - /root/respaldos-offlinepos:/respaldos
    networks:
      - vps-net

networks:
  vps-net:
    external: true

volumes:
  pos-updates:
