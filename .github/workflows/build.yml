name: build

# Valida que las tres imagenes construyan y que las pruebas del backend pasen
# ANTES de llegar a main.
#
# deploy.yml corre solo en push a main y construye en el VPS: sin este
# workflow, un lockfile desincronizado, un Dockerfile roto o una prueba en rojo
# se descubren recien en produccion (paso el 2026-10-18 con
# panel/package-lock.json, que se habia editado a mano).
#
# Se construye Dockerfile por Dockerfile y no con `docker compose build` a
# proposito: la imagen base del Dockerfile ES la fuente de verdad del npm que
# valida el lockfile, y compose ataria este job a los env_file del VPS.
# Cada entrada de la matriz corre en su propio runner, asi que el disco no se
# reparte entre las tres imagenes.
#
# La suite del panel (panel/pruebas/panel.prueba.mjs) NO esta aca a proposito:
# es de punta a punta con Playwright contra el panel compilado y el backend
# simulado, asi que necesita instalar un navegador y levantar dos procesos. Es
# un trabajo aparte; un job que falla de a ratos por flakiness es peor que no
# tener el job.

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: panel
            dockerfile: panel/Dockerfile
          - image: backend
            dockerfile: backend/Dockerfile
          - image: landing
            dockerfile: landing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Construir ${{ matrix.image }}
        run: docker build --file ${{ matrix.dockerfile }} --tag ci-${{ matrix.image }} .

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Las comprobaciones viven en scripts/verificar.sh y las comparte con la
      # puerta de deploy.yml: un solo lugar, para que no se separen.
      - name: Comprobaciones
        run: sh scripts/verificar.sh
