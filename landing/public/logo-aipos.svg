<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- AIPOS - Isotipo (Fondo transparente) -->
  <defs>
    <style>
      .logo-line {
        fill: none;
        stroke: #3b82f6;
        stroke-width: 44;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-arrow {
        fill: #3b82f6;
        stroke: #3b82f6;
        stroke-width: 6;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <g id="aipos-logo-symbol">
    <!-- Trazo continuo M y V ascendente -->
    <path class="logo-line" d="M 120 375 L 120 190 L 190 275 L 262 190 L 332 337 L 397.7 223.2" />
    
    <!-- Cabeza de la flecha integrada -->
    <polygon class="logo-arrow" points="435.0,170.0 430.5,246.2 365.0,200.3" />
  </g>
</svg>
